name: Discover

on:
  workflow_call:
    outputs:
      modules:
        description: "JSON list of Terraform module directories, relative to modules/"
        value: ${{ jobs.discover.outputs.modules }}
      examples:
        description: "JSON list of example directories, relative to examples/"
        value: ${{ jobs.discover.outputs.examples }}

jobs:
  discover:
    name: Discover Modules & Examples
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
      examples: ${{ steps.set-matrix.outputs.examples }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set Matrix
      id: set-matrix
      run: |
        # Discover module roots: any directory under modules/ containing a main.tf.
        # Nested submodules (kept in a modules/ subdirectory of their parent module)
        # are excluded as they are initialised and validated via their parent.
        modules=$(find modules -type f -name "main.tf" \
          | sed 's|^modules/||; s|/main\.tf$||' \
          | grep -vE '(^|/)modules(/|$)' \
          | sort \
          | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')
        echo "modules=${modules}" >> "$GITHUB_OUTPUT"
        echo "Discovered modules: ${modules}"

        examples=$(find examples -mindepth 1 -maxdepth 1 -type d \
          | sed 's|^examples/||' \
          | sort \
          | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')
        echo "examples=${examples}" >> "$GITHUB_OUTPUT"
        echo "Discovered examples: ${examples}"
